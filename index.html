
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />

  <title>AI Cover Studio</title>

  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body>
  <div class="shell">

    <!-- HEADER -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">◈</span>
        <span>AI COVER <strong>STUDIO</strong></span>
      </div>
    </header>

    <main>

      <!-- WORKSPACE -->
      <div class="workspace">

        <!-- 01: SOURCE VOCAL -->
        <section class="panel">
          <div class="panel-top">
            <span class="num">01</span>
            <h2>Source vocal</h2>
          </div>

          <label for="audioInput" class="dropzone">
            <span class="dropicon">♫</span>
            <strong>Wybierz swoje nagranie</strong>
            <span>MP3, WAV, OGG, M4A</span>
            <span class="choose">Choose audio</span>
          </label>

          <input
            id="audioInput"
            type="file"
            accept="audio/*,.mp3,.wav,.ogg,.m4a"
            hidden
          />

          <div
            class="audio-details"
            id="audioDetails"
            hidden
          >
            <div class="fileline">
              <span id="audioName"></span>

              <button
                id="removeAudio"
                class="text-button"
                type="button"
              >
                Usuń
              </button>
            </div>

            <audio
              id="audioPlayer"
              controls
              preload="metadata"
            ></audio>
          </div>
        </section>

        <!-- 02: VOICE LIBRARY -->
        <section class="panel">
          <div class="panel-top">
            <span class="num">02</span>
            <h2>Voice library</h2>
            <span id="modelCount" class="count">
              0 models
            </span>
          </div>

          <label for="modelInput" class="import-model">
            <span>＋</span>
            Import model ZIP
          </label>

          <input
            id="modelInput"
            type="file"
            accept=".zip,application/zip"
            multiple
            hidden
          />

          <div id="modelsList" class="model-list">
            <p class="empty">
              No models imported yet.
            </p>
          </div>

          <p class="help">
            Modele zapisane lokalnie w przeglądarce.
          </p>
        </section>

        <!-- 03: CONVERSION SETTINGS -->
        <section class="panel settings-panel">
          <div class="panel-top">
            <span class="num">03</span>
            <h2>Conversion settings</h2>
          </div>

          <label for="pitch">
            Pitch shift
            <output id="pitchValue">
              0 semitones
            </output>
          </label>

          <input
            id="pitch"
            type="range"
            min="-12"
            max="12"
            step="1"
            value="0"
          />

          <div class="range-end">
            <span>−12</span>
            <span>0</span>
            <span>+12</span>
          </div>

          <button
            class="convert"
            id="convertButton"
            type="button"
            disabled
          >
            Convert vocal
            <span>↗</span>
          </button>
        </section>

      </div>

      <!-- 04: CONVERTED VOCAL -->
      <section
        class="panel result-panel"
        id="resultPanel"
        hidden
      >
        <div class="panel-top">
          <span class="num">04</span>
          <h2>Converted vocal</h2>
        </div>

        <audio
          id="resultPlayer"
          controls
          preload="metadata"
        ></audio>

        <a
          id="downloadResult"
          class="download-result"
          download="converted-vocal.wav"
        >
          Download WAV ↓
        </a>
      </section>

      <!-- STATUS -->
      <div
        id="status"
        class="status"
        role="status"
        aria-live="polite"
      >
        Studio ready.
      </div>

    </main>

    <footer>
      AI COVER STUDIO
    </footer>

  </div>
</body>
</html>
